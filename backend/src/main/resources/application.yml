spring:
  application:
    name: tenashop
  # Lets a local run pick up the repo-root .env (ignored when the file is absent, e.g. in Docker)
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_HOST_PORT:5544}/${POSTGRES_DB:tenashop}}
    username: ${POSTGRES_USER:tenashop}
    password: ${POSTGRES_PASSWORD:change-me}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  # Customer emails. Locally: Mailpit in Docker (inbox at http://localhost:8626)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:2626}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:${KAFKA_HOST_PORT:29492}}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        max.block.ms: 5000
    consumer:
      group-id: tenashop
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: ${BACKEND_PORT:8181}

management:
  endpoints:
    web:
      exposure:
        # /actuator/prometheus is limited to this machine and the Docker network (SecurityConfig)
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  health:
    # an email outage must not mark the shop as down
    mail:
      enabled: false
  metrics:
    tags:
      application: tenashop
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

billpay:
  base-url: ${BILLPAY_BASE_URL:https://sandbox.api.billpay.et}
  api-key: ${BILLPAY_API_KEY:}
  create-payment-path: /api/v1/checkout/payments
  # Confirmed 2026-10-23 (open question Q5)
  payment-status-path: /api/v1/checkout/payments/{id}
  # Path confirmed 2026-10-23; request body still unconfirmed (open question Q6)
  refund-path: /api/v1/checkout/payments/{id}/refunds
  timeout: ${BILLPAY_TIMEOUT_MS:10000}ms
  webhook:
    # HMAC_SHA256 over "<t>.<body>" in X-Billpay-Signature (confirmed 2026-10-23); NONE is sandbox-only
    verification: ${BILLPAY_WEBHOOK_VERIFICATION:NONE}
    secret: ${BILLPAY_WEBHOOK_SECRET:}
    signature-header: ${BILLPAY_WEBHOOK_SIGNATURE_HEADER:X-BillPay-Signature}

# Product photos: any S3-compatible store (SeaweedFS in Docker locally; AWS S3 / Cloudflare R2 later)
media:
  endpoint: ${MEDIA_S3_ENDPOINT:http://localhost:9910}
  region: ${MEDIA_S3_REGION:us-east-1}
  bucket: ${MEDIA_S3_BUCKET:tenashop-media}
  access-key: ${MEDIA_S3_ACCESS_KEY:tenashop}
  secret-key: ${MEDIA_S3_SECRET_KEY:tenashop-local-secret}
  # served by the backend, so the bucket can stay private
  public-path: /api/media

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:5280}
  # BillPay requires https return/cancel URLs; locally set this to the ngrok URL (see BillPayRedirectController)
  redirect-base-url: ${APP_REDIRECT_BASE_URL:}
  cors-origins: ${APP_CORS_ORIGINS:http://localhost:5280}
  reconcile-after: ${RECONCILE_AFTER:PT3M}
  payment-expiry: ${PAYMENT_EXPIRY:PT30M}
  admin-email: ${ADMIN_EMAIL:admin@tenashop.local}
  admin-password: ${ADMIN_PASSWORD:change-me}
  jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
  # Delivery inside Addis Ababa: flat fee, free from a cart subtotal (ETB)
  delivery:
    flat-fee: ${DELIVERY_FLAT_FEE:150}
    free-over: ${DELIVERY_FREE_OVER:3000}
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:TenaShop <orders@tenashop.local>}
    # shown in the admin as "Open test inbox" (Mailpit); leave empty with a real mail server
    inbox-url: ${MAIL_INBOX_URL:http://localhost:8626}

logging:
  level:
    et.tenapay.shop: DEBUG
