spring:
  application:
    name: tenashop
  # Lets a local run pick up the repo-root .env (ignored when the file is absent, e.g. in Docker)
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_HOST_PORT:5544}/${POSTGRES_DB:tenashop}}
    username: ${POSTGRES_USER:tenashop}
    password: ${POSTGRES_PASSWORD:change-me}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  # Customer emails. Locally: Mailpit in Docker (inbox at http://localhost:8626)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:2626}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:${KAFKA_HOST_PORT:29492}}
    # One consumer thread per partition (topics have 3). With 1 thread, webhooks were applied one at a time and
    # "paid" lagged up to 21 s under load (perf checkout test). Events of one payment share a key, so they stay in order.
    listener:
      concurrency: 3
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        max.block.ms: 5000
    consumer:
      group-id: tenashop
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: ${BACKEND_PORT:8181}

management:
  endpoints:
    web:
      exposure:
        # /actuator/prometheus is limited to this machine and the Docker network (SecurityConfig)
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  health:
    # an email outage must not mark the shop as down
    mail:
      enabled: false
  metrics:
    tags:
      application: tenashop
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

billpay:
  # Mode new payments use until an admin switches it in Admin → BillPay setup (the choice is then kept in the database)
  mode: ${BILLPAY_MODE:SANDBOX}
  sandbox:
    base-url: ${BILLPAY_SANDBOX_BASE_URL:https://sandbox.api.billpay.et}
    api-key: ${BILLPAY_SANDBOX_API_KEY:}
    webhook-secret: ${BILLPAY_SANDBOX_WEBHOOK_SECRET:}
  live:
    base-url: ${BILLPAY_LIVE_BASE_URL:https://api.billpay.et}
    api-key: ${BILLPAY_LIVE_API_KEY:}
    webhook-secret: ${BILLPAY_LIVE_WEBHOOK_SECRET:}
  create-payment-path: /api/v1/checkout/payments
  # Confirmed 2026-10-23 (open question Q5)
  payment-status-path: /api/v1/checkout/payments/{id}
  # Path confirmed 2026-10-23; request body still unconfirmed (open question Q6)
  refund-path: /api/v1/checkout/payments/{id}/refunds
  timeout: ${BILLPAY_TIMEOUT_MS:10000}ms
  webhook:
    # HMAC_SHA256 over "<t>.<body>" in X-Billpay-Signature (confirmed 2026-10-23); NONE is sandbox-only
    verification: ${BILLPAY_WEBHOOK_VERIFICATION:NONE}
    signature-header: ${BILLPAY_WEBHOOK_SIGNATURE_HEADER:X-BillPay-Signature}

# Product photos: any S3-compatible store (SeaweedFS in Docker locally; AWS S3 / Cloudflare R2 later)
media:
  endpoint: ${MEDIA_S3_ENDPOINT:http://localhost:9910}
  region: ${MEDIA_S3_REGION:us-east-1}
  bucket: ${MEDIA_S3_BUCKET:tenashop-media}
  access-key: ${MEDIA_S3_ACCESS_KEY:tenashop}
  secret-key: ${MEDIA_S3_SECRET_KEY:tenashop-local-secret}
  # served by the backend, so the bucket can stay private
  public-path: /api/media

# Text messages. No AFROMESSAGE_TOKEN = test mode: messages go to the backend log and Admin → SMS, never to phones.
sms:
  timeout: ${SMS_TIMEOUT:PT10S}
  # local development only: show sign-in codes on screen in test mode (never with a real provider or BillPay live)
  dev-codes-in-response: ${SMS_DEV_CODES_IN_RESPONSE:false}
  # order updates by SMS: finish-paying reminder, payment received, on the way, delivered
  order-updates: ${SMS_ORDER_UPDATES:true}
  afromessage:
    base-url: ${AFROMESSAGE_BASE_URL:https://api.afromessage.com}
    token: ${AFROMESSAGE_TOKEN:}
    identifier-id: ${AFROMESSAGE_IDENTIFIER_ID:}
    sender: ${AFROMESSAGE_SENDER:}
    callback: ${AFROMESSAGE_CALLBACK:}

# Telegram bot. No TELEGRAM_BOT_TOKEN = test mode: replies and alerts are logged (Admin → SMS), never sent.
telegram:
  token: ${TELEGRAM_BOT_TOKEN:}
  bot-username: ${TELEGRAM_BOT_USERNAME:}
  # new listings are posted here, e.g. @sodogebeya (the bot must be a channel admin); blank = off
  channel-id: ${TELEGRAM_CHANNEL_ID:}
  # Telegram sends it with every webhook call; blank = webhook off
  webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
  base-url: ${TELEGRAM_BASE_URL:https://api.telegram.org}
  timeout: ${TELEGRAM_TIMEOUT:PT10S}
  channel-every: ${TELEGRAM_CHANNEL_EVERY:PT5M}

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:5280}
  # BillPay requires https return/cancel URLs; locally set this to the ngrok URL (see BillPayRedirectController)
  redirect-base-url: ${APP_REDIRECT_BASE_URL:}
  cors-origins: ${APP_CORS_ORIGINS:http://localhost:5280}
  reconcile-after: ${RECONCILE_AFTER:PT3M}
  payment-expiry: ${PAYMENT_EXPIRY:PT30M}
  # one "finish paying" email this long before an unpaid order expires (PT0S = off)
  payment-reminder-before: ${PAYMENT_REMINDER_BEFORE:PT10M}
  admin-email: ${ADMIN_EMAIL:admin@tenashop.local}
  admin-password: ${ADMIN_PASSWORD:change-me}
  jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
  # Delivery inside Addis Ababa: flat fee, free from a cart subtotal (ETB)
  # Admin → Load tests talks to this runner (scripts/dev.sh perf starts it)
  perf:
    runner-url: ${PERF_RUNNER_URL:http://localhost:9930}
  delivery:
    flat-fee: ${DELIVERY_FLAT_FEE:150}
    free-over: ${DELIVERY_FREE_OVER:3000}
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:Sodo Gebeya <orders@sodogebeya.local>}
    # shown in the admin as "Open test inbox" (Mailpit); leave empty with a real mail server
    inbox-url: ${MAIL_INBOX_URL:http://localhost:8626}

logging:
  level:
    et.tenapay.shop: DEBUG
