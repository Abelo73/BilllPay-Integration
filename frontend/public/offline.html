<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E5A43">
<title>Offline · Sodo Gebeya</title>
<style>
  :root { --bg: #F4F8F6; --ink: #13201A; --muted: #5B635E; --green: #0E5A43; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121614; --ink: #EEF0EC; --muted: #A3ACA6; --green: #4CBF85; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans Ethiopic', sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 360px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 20px; }
  h1 { font-size: 22px; margin: 16px 0 8px; }
  p { color: var(--muted); line-height: 1.5; margin: 0 0 20px; }
  button { min-height: 48px; padding: 0 22px; border: 0; border-radius: 14px; background: var(--green); color: #fff;
           font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>Sodo Gebeya needs the internet to show products and take payments. Check your data or Wi-Fi and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
