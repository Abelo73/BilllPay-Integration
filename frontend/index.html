<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sodo Gebeya: buy and sell in Wolaita Sodo</title>
    <script>
      try {
        var t = localStorage.getItem("tenashop-theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <meta name="description" content="Sodo Gebeya: the online market for Wolaita Sodo. Shops and people selling clothes, phones, furniture and more, with BillPay checkout and local delivery." />
    <meta name="theme-color" content="#146C43" />
    <!-- installable app (PWA): manifest + icons; the service worker is registered in main.tsx (production builds only) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sodo Gebeya" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
