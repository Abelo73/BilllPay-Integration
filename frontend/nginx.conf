server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # product photos are up to 5 MB; nginx allows only 1 MB by default
    client_max_body_size 6m;

    # Same-origin API: the browser never needs CORS, and BillPay webhooks can also come in through here.
    location /api/ {
        proxy_pass http://backend:8181;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routes such as /checkout/return
    location / {
        try_files $uri /index.html;
    }
}
