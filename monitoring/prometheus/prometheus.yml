# Prometheus for TenaShop (http://localhost:9390). Scrapes the backend every 15 s.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The backend runs either on the host (scripts/dev.sh) or in Compose with 8181 published on the host,
  # so host.docker.internal:8181 reaches it in both cases. /actuator/prometheus only answers direct,
  # private-network requests (never via ngrok or nginx).
  - job_name: tenashop-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8181']
        labels:
          service: backend

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
