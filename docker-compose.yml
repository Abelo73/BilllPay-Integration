# TenaShop stack. All host ports are non-default and come from .env (see .env.example).
#   Infra only (run apps locally):  docker compose up -d postgres kafka kafka-ui media mailpit prometheus alertmanager blackbox grafana-db-init grafana
#   Everything:                     docker compose up -d --build
name: tenashop

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tenashop}
      POSTGRES_USER: ${POSTGRES_USER:-tenashop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_HOST_PORT:-5544}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29492,CONTROLLER://:9093
      # Containers use kafka:9092; apps on the host use localhost:<KAFKA_HOST_PORT>
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-29492}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "${KAFKA_HOST_PORT:-29492}:29492"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

  kafka-ui:
    image: kafbat/kafka-ui:v1.2.0
    environment:
      KAFKA_CLUSTERS_0_NAME: tenashop
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "${KAFKA_UI_PORT:-8191}:8080"
    depends_on:
      kafka:
        condition: service_healthy

  # Product photos: S3-compatible object store (SeaweedFS). MinIO stopped publishing public images in 2025.
  media:
    image: chrislusf/seaweedfs:4.48
    environment:
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:-tenashop}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:-tenashop-local-secret}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"tenashop","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$MEDIA_S3_ACCESS_KEY" "$$MEDIA_S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=256 -volume.max=0
    ports:
      - "${MEDIA_S3_HOST_PORT:-9910}:8333"   # S3 API
      - "${MEDIA_UI_PORT:-9911}:8888"        # file browser
    volumes:
      - mediadata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Customer emails in development: catches everything sent over SMTP; open the inbox in the browser
  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      MP_MAX_MESSAGES: 2000
    ports:
      - "${MAIL_PORT:-2626}:1025"          # SMTP
      - "${MAILPIT_UI_PORT:-8626}:8025"    # inbox
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8025/livez"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Monitoring: Prometheus scrapes /actuator/prometheus, Grafana shows the provisioned dashboards
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      # load-test numbers from k6 (perf-runner) arrive here
      - --web.enable-remote-write-receiver
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PROMETHEUS_PORT:-9390}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Sends firing alerts as emails (Mailpit in dev). UI and silences: http://localhost:9393
  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9393}:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - amdata:/alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Outside checks (store, backend, ngrok tunnel, BillPay) for Prometheus. Runs on the host network so it
  # reaches localhost-only dev servers (Vite) exactly like your browser does; listens on 9395 (default 9115).
  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    network_mode: host
    command: ["--config.file=/etc/blackbox/blackbox.yml", "--web.listen-address=:${BLACKBOX_PORT:-9395}"]
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro

  # One-shot: creates/updates the read-only grafana_reader database user, then exits
  grafana-db-init:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-tenashop}
      PGUSER: ${POSTGRES_USER:-tenashop}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me}
      READER_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana-reader-local}
    command: ["sh", "-c", "psql -q -v ON_ERROR_STOP=1 -v reader_password=\"$$READER_PASSWORD\" -v dbname=\"$$PGDATABASE\" -f /init/grafana-reader.sql"]
    volumes:
      - ./monitoring/postgres:/init:ro
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      # used by provisioning/datasources (TenaShop DB)
      TENASHOP_DB_NAME: ${POSTGRES_DB:-tenashop}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana-reader-local}
      # dashboards are readable without signing in (local dev); editing needs the admin login
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/payments.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "${GRAFANA_PORT:-8484}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ---------- Load testing (profile "perf"): scripts/dev.sh perf ----------
  # A separate copy of the shop (own database tenashop_perf, own Kafka, fake BillPay, no emails), so load
  # tests never touch your dev data and never call the real BillPay.
  perf-db-init:
    image: postgres:16-alpine
    profiles: [perf]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        psql -h postgres -U ${POSTGRES_USER:-tenashop} -d postgres -tc "select 1 from pg_database where datname = 'tenashop_perf'" | grep -q 1 \
          || psql -h postgres -U ${POSTGRES_USER:-tenashop} -d postgres -c "create database tenashop_perf"
    depends_on:
      postgres:
        condition: service_healthy

  perf-kafka:
    image: apache/kafka:3.9.1
    profiles: [perf]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://perf-kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@perf-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xmx384m -Xms384m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server perf-kafka:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

  # Answers like sandbox.api.billpay.et (300-800 ms); payment ids are "perf-<merchantReference>"
  perf-billpay:
    image: wiremock/wiremock:3.9.1
    profiles: [perf]
    command: ["--global-response-templating", "--disable-banner", "--no-request-journal"]
    volumes:
      - ./perf/fakebillpay/mappings:/home/wiremock/mappings:ro
    ports:
      - "127.0.0.1:${PERF_BILLPAY_PORT:-9919}:8080"

  perf-backend:
    build: ./backend
    profiles: [perf]
    environment:
      BACKEND_PORT: 8282
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tenashop_perf
      POSTGRES_USER: ${POSTGRES_USER:-tenashop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      KAFKA_BOOTSTRAP_SERVERS: perf-kafka:9092
      MEDIA_S3_ENDPOINT: http://media:8333
      MEDIA_S3_BUCKET: tenashop-perf
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:-tenashop}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:-tenashop-local-secret}
      MAIL_ENABLED: "false"
      BILLPAY_MODE: SANDBOX
      BILLPAY_SANDBOX_BASE_URL: http://perf-billpay:8080
      BILLPAY_SANDBOX_API_KEY: BPG_TEST-perf-fake-key-0000
      BILLPAY_SANDBOX_WEBHOOK_SECRET: whsec_perf_secret
      BILLPAY_LIVE_API_KEY: ""
      BILLPAY_WEBHOOK_VERIFICATION: HMAC_SHA256
      BILLPAY_WEBHOOK_SIGNATURE_HEADER: X-Billpay-Signature
      ADMIN_EMAIL: perf-admin@perf.local
      ADMIN_PASSWORD: Perf-admin-2026
      JWT_SECRET: perf-only-jwt-secret-0123456789abcdef0123
      APP_PUBLIC_BASE_URL: http://localhost:8282
      APP_REDIRECT_BASE_URL: ""
      # same limits every run, so results compare
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      # tuning knobs to try without rebuilding (defaults come from application.yml)
      SPRING_KAFKA_LISTENER_CONCURRENCY: ${PERF_KAFKA_CONCURRENCY:-3}
    mem_limit: 1g
    cpus: 2
    ports:
      - "127.0.0.1:${PERF_BACKEND_PORT:-8282}:8282"
    depends_on:
      perf-db-init:
        condition: service_completed_successfully
      perf-kafka:
        condition: service_healthy
      perf-billpay:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8282/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # k6 + a small control API; Admin → Load tests talks to it through the backend
  perf-runner:
    build: ./perf
    profiles: [perf]
    environment:
      TARGET: http://perf-backend:8282
      FAKE_BILLPAY: http://perf-billpay:8080
      PROMETHEUS_RW_URL: http://prometheus:9090/api/v1/write
    volumes:
      - perfruns:/runner/runs
    ports:
      - "127.0.0.1:${PERF_RUNNER_PORT:-9930}:9930"
    depends_on:
      - perf-backend

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tenashop}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MEDIA_S3_ENDPOINT: http://media:8333
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      BACKEND_PORT: 8181
    ports:
      - "${BACKEND_PORT:-8181}:8181"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      media:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-5280}:80"
    depends_on:
      - backend

volumes:
  pgdata:
  kafkadata:
  mediadata:
  promdata:
  amdata:
  grafanadata:
  perfruns:
